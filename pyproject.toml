[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pm"
version = "0.1.0"
description = "Plex Metadata Agent — scheduled sidecar + Plex API writer"
requires-python = ">=3.9"
dependencies = [
    "apscheduler>=3.10",
    "httpx>=0.27",
    "lxml>=5.0",
    "python-plexapi>=4.15",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-v"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
