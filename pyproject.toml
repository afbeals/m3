[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "m3"
version = "1.3.0"
description = "Plex Metadata Agent — scheduled sidecar + Plex API writer"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "lxml>=5.2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "python-plexapi>=4.15",
    "uvicorn>=0.30",
    "watchfiles>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-v"
markers = [
    "unit: fast, no I/O, fully mocked",
    "integration: touches real filesystem or mocked external services",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
