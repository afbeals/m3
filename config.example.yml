# config.example.yml
#
# Reference list of all environment variables supported by pm.
# Copy the relevant lines into your Docker run command, docker-compose.yml,
# or Unraid Docker template.
#
# NOTE: pm reads configuration exclusively from environment variables.
# There is no YAML config file loader — this file is documentation only.
#
# Secret values (PLEX_TOKEN, API keys) should be set as env vars directly
# and never committed to version control.

# ---------------------------------------------------------------------------
# Plex connection (REQUIRED)
# ---------------------------------------------------------------------------

# URL of your Plex Media Server, reachable from inside the Docker container.
# PLEX_URL=http://192.168.1.100:32400

# Plex authentication token.
# Find yours at: https://support.plex.tv/articles/204059436
# PLEX_TOKEN=your-plex-token-here

# ---------------------------------------------------------------------------
# Library paths (REQUIRED)
# ---------------------------------------------------------------------------

# Comma-separated list of container paths that contain your media files.
# These must be mounted read-write so pm can write .nfo sidecars and images.
# LIBRARY_PATHS=/media/movies,/media/adult

# ---------------------------------------------------------------------------
# Plugin directory
# ---------------------------------------------------------------------------

# Path to the directory where your plugin .py files live.
# Mount this from your host into the container.
# Default: /plugins
# PLUGIN_DIR=/plugins

# ---------------------------------------------------------------------------
# Scheduling
# ---------------------------------------------------------------------------

# Standard 5-field cron expression controlling when the agent runs.
# Default: 3am every night.
# RUN_SCHEDULE=0 3 * * *

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

# Verbosity level for the log output.
# One of: DEBUG, INFO, WARNING, ERROR, CRITICAL
# Default: INFO
# LOG_LEVEL=INFO

# Directory where rotating log files are written.
# Default: /config/logs
# LOG_PATH=/config/logs

# Log files older than this many days are deleted at the end of each run.
# Default: 30
# LOG_RETENTION_DAYS=30

# ---------------------------------------------------------------------------
# Run reports
# ---------------------------------------------------------------------------

# Directory where per-run JSON + summary text reports are written.
# Default: /config/reports
# REPORT_PATH=/config/reports

# Report files older than this many days are deleted at the end of each run.
# Default: 90
# REPORT_RETENTION_DAYS=90

# ---------------------------------------------------------------------------
# Timezone
# ---------------------------------------------------------------------------

# IANA timezone name for the scheduler. Affects when RUN_SCHEDULE fires.
# Requires tzdata to be installed in the container (included by default).
# Default: UTC
# TZ=America/New_York

# ---------------------------------------------------------------------------
# Library scanning
# ---------------------------------------------------------------------------

# Comma-separated glob patterns for files or paths to exclude from scanning.
# Matched against the full absolute path inside the container.
# Examples:
#   *.part             — skip incomplete downloads
#   /media/incoming/** — skip an entire staging directory
#   *sample*           — skip sample/trailer files
# Default: "" (no exclusions)
# LIBRARY_EXCLUDE_PATTERNS=*.part,/media/incoming/**

# ---------------------------------------------------------------------------
# Plugin behaviour
# ---------------------------------------------------------------------------

# Seconds to wait between plugin fetch() calls (rate limiting).
# Increase this if a site blocks you for hitting it too fast.
# Set to 0 to disable rate limiting entirely.
# Default: 1.0
# PLUGIN_RATE_LIMIT_SECS=1.0

# Maximum seconds a single plugin fetch() may run before it is recorded as
# status=error and the run continues with the next file.
# Default: 60.0
# PLUGIN_FETCH_TIMEOUT_SECS=60.0

# ---------------------------------------------------------------------------
# Web dashboard
# ---------------------------------------------------------------------------

# Enable or disable the built-in web dashboard.
# Default: true
# WEB_ENABLED=true

# Port the dashboard HTTP server listens on inside the container.
# Map this to a host port in your Docker / Unraid config.
# Default: 8765
# WEB_PORT=8765

# Host/IP the dashboard binds to.
# 0.0.0.0 means it's reachable from outside the container (normal Docker usage).
# Change to 127.0.0.1 to restrict to localhost only.
# Default: 0.0.0.0
# WEB_HOST=0.0.0.0

# Display name shown in the dashboard header, page title, and footer.
# Change this if you've renamed the project or run multiple instances.
# Default: pm
# APP_NAME=pm

# ---------------------------------------------------------------------------
# Notifications (optional)
# ---------------------------------------------------------------------------

# Optional webhook URL. After every completed (non-dry-run) run pm POSTs a compact JSON
# summary (updated, errors, unmatched, duration, timestamps, first_error) to this URL.
# Leave unset to disable. Works with:
#   - Apprise API:  http://apprise-host/notify/myjson
#   - Gotify:       http://gotify-host/message?token=xxx
#   - Pushover relay or any HTTP endpoint that accepts JSON POST
# NOTIFY_URL=http://your-notify-endpoint/hook

# ---------------------------------------------------------------------------
# Plugin-specific API keys
# ---------------------------------------------------------------------------
# Each plugin reads its own key from os.environ. Set these as Docker env vars:
#
#   MYSITE_API_KEY=your-key-here
#   OTHERSITE_API_KEY=your-key-here
#
# Never commit real API keys to version control.
