[mypy]
# Target the minimum supported Python version
python_version = 3.9

# Strict mode settings — catch the most common type errors
warn_return_any = True
warn_unused_configs = True
warn_unused_ignores = True
warn_redundant_casts = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True

# Show error codes so you know which rule to suppress if needed
show_error_codes = True

# Per-module overrides for third-party packages that don't ship stubs
[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-lxml.*]
ignore_missing_imports = True

[mypy-plexapi.*]
ignore_missing_imports = True
