services:
  pm:
    build: .
    image: pm:latest
    container_name: pm
    restart: unless-stopped
    volumes:
      - ./plugins:/plugins
      - ./data/config:/config
      - ./data/media:/media
    ports:
      - "8765:8765"
    environment:
      - PLEX_URL=http://192.168.1.x:32400
      - PLEX_TOKEN=your-plex-token
      - LIBRARY_PATHS=/media
      - PLUGIN_DIR=/plugins
      - REPORT_PATH=/config/reports
      - LOG_PATH=/config/logs
      - RUN_SCHEDULE=0 3 * * *
      - LOG_LEVEL=INFO
      - LOG_RETENTION_DAYS=30
      - REPORT_RETENTION_DAYS=90
      - WEB_ENABLED=true
      - WEB_PORT=8765
      - APP_NAME=pm
      # Optional: webhook URL for post-run JSON notifications (Apprise, Gotify, etc.)
      # - NOTIFY_URL=
      # Optional: seconds between plugin API calls (0 to disable, default 1.0)
      # - PLUGIN_RATE_LIMIT_SECS=1.0
