<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}{% endblock %} — {{ app_name }}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>▸</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"
          integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2uoICbeVVCcHvz0Ljr4LiGHl0sWVIbCEslA"
          crossorigin="anonymous" defer
          onerror="var s=document.createElement('script');s.src='/static/htmx.min.js';document.head.appendChild(s)"></script>
</head>
<body>
  <header>
    <a href="/" class="logo" aria-label="{{ app_name }} — go to dashboard">▸ {{ app_name }}</a>
    <nav aria-label="Main navigation">
      <a href="/" {% if request.url.path == "/" %}class="active" aria-current="page"{% endif %}>Latest Run</a>
      <a href="/runs" {% if request.url.path == "/runs" or request.url.path.startswith("/runs/") %}class="active" aria-current="page"{% endif %}>History</a>
      <a href="/unmatched" {% if request.url.path == "/unmatched" %}class="active" aria-current="page"{% endif %}>Unmatched</a>
      <a href="/plugins" {% if request.url.path == "/plugins" %}class="active" aria-current="page"{% endif %}>Plugins</a>
      <a href="/config" {% if request.url.path == "/config" %}class="active" aria-current="page"{% endif %}>Config</a>
      <a href="/files" {% if request.url.path == "/files" %}class="active" aria-current="page"{% endif %}>Files</a>
      <a href="/logs" {% if request.url.path == "/logs" %}class="active" aria-current="page"{% endif %}>Logs</a>
    </nav>
    <span class="status-slot" aria-live="polite" aria-label="Agent status" hx-get="/api/status" hx-trigger="load, every 2s" hx-swap="innerHTML"></span>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>{{ app_name }} — Plex Metadata Agent{% if version %} · v{{ version }}{% endif %}</footer>
</body>
</html>
