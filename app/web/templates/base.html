<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} — {{ app_name }}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>▸</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js" defer></script>
</head>
<body>
  <header>
    <span class="logo">▸ {{ app_name }}</span>
    <nav>
      <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Latest Run</a>
      <a href="/runs" {% if request.url.path.startswith("/runs") %}class="active"{% endif %}>History</a>
      <a href="/unmatched" {% if request.url.path == "/unmatched" %}class="active"{% endif %}>Unmatched</a>
      <a href="/plugins" {% if request.url.path == "/plugins" %}class="active"{% endif %}>Plugins</a>
      <a href="/config" {% if request.url.path == "/config" %}class="active"{% endif %}>Config</a>
      <a href="/logs" {% if request.url.path == "/logs" %}class="active"{% endif %}>Logs</a>
    </nav>
    <span class="status-slot" hx-get="/api/status" hx-trigger="load, every 2s" hx-swap="innerHTML"></span>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>{{ app_name }} — Plex Metadata Agent</footer>
</body>
</html>
